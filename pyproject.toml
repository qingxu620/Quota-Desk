[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-desk"
version = "0.1.0a1"
description = "A local Windows dashboard for Antigravity and Codex quotas and accounts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Quota Desk contributors"}]
dependencies = ["Pillow>=10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quota-desk = "quota_desk.__main__:main"

[project.gui-scripts]
quota-desk-gui = "quota_desk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quota_desk = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
